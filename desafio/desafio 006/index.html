<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 006</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos insirir os elementos da lista a seguir. Passe o mouse sobre os termos para descubrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li><abbr title="Use a Tag &lt;P&ngt;">Paragrafo</abbr></li>
        <li><abbr title="Use a Tag &lt;H1&ngt; a &lt;H6&ngt;">Titulos</abbr></li>
        <li><abbr title="Use a Tag &lt;img&ngt;">Imagens</abbr></li>
        <li><abbr title="Use a Tag &lt;ABBR&ngt;">Abreviações</abbr></li>
        <li><abbr title="Use a Tag &lt;code&ngt;">Codigo-fonte</abbr></li>
        <li><abbr title="Use a Tag &lt;ole&ngt; e &lt;li&ngt;">Listas numeradas</abbr></li>
        <li><abbr title="Use a Tag &lt;ul&ngt;e &lt;li&ngt;">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
