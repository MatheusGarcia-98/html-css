<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        table{
            border-collapse: collapse;
            
        }

        thead  {
            background-color: rgb(73, 73, 73);
            color: white;
            height: 80px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }


        .media {
            background-color: rgb(73, 73, 73);
            color: white
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th scope="col">Área</th>
            <th scope="rowgroup">Diciplina</th>
            <th colspan="2" scope="rowgroup">Notas</th>
            <th scope="row">Media</th>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" scope="colgroup">Exatas</th>
                <td scope="col">Matematica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>
            <tr>
                <td scope="col">Fisica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="col">Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="col">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="media" colspan="4" scope="col">Media de Exata</th>
                <td class="media">0.0</td>
                
            </tr>
            <tr>
                <th rowspan="2" scope="colgroup">Humanas</th>
                <td scope="col">Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="col">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="media" colspan="4" scope="col">Media Humanas</th>
                <td class="media">0.0</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
